# Publishes web/ to GitHub Pages. One-time setup: repository Settings > Pages >
# Build and deployment > Source: GitHub Actions.
name: Deploy web version

on:
  push:
    branches: [master]
    paths: ["web/index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the page
        run: mkdir _site && cp web/index.html _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
