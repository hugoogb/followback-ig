name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 build, and 3.9 is the
    # oldest version pyproject.toml promises to support.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest test_ig_followback -v
      - name: Installs as a command
        run: |
          python -m pip install .
          followback --help

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node web/test_web.cjs
